# yaml-language-server: $schema=https://raw.githubusercontent.com/mairie360/CICD/main/tests/a11y/rgaa.schema.json
# RGAA 4.1.2 scope of the calendar front (MAIR-316), checked by the RGAA job of mairie360/CICD
# frontend-cicd.yml in release-prod, on the staging-<sha> image (format: CICD README, "RGAA scope").
version: 1
target: http://calendar-front:5002

# Same JWT_SECRET as the services of docker-compose-accessibility.yml: the engine signs an
# accessToken for the user of the state (as:), the front relays it to bff-user and bff-calendar.
session:
  jwt_secret: b"secret"

# Seed users (init-test.sql, init-accessibility.sql). The roles come from the database (user_roles),
# the role claim is not read by the BFFs.
users:
  # Role User, creator and member of the events of January 2026 (edit / delete allowed).
  agent:
    id: 2
    role: user
  # Role Responsable, shares a group with user 2: validates the pending event 901.
  responsable:
    id: 4
    role: responsable
  # Only for event-created, which writes an event: the states run in parallel, the ones played
  # as agent must not see it.
  writer:
    id: 3
    role: user

criteria:
  # Images: the logo and the icons of the shell, the toolbar and the dialogs.
  - "1.1"
  - "1.2"
  - "1.3"
  # 1.4-1.9: no CAPTCHA, chart, image of text or figure caption.
  # 2.x: no frame. 4.x: no media. 5.x: no data table (the month / week grids are not tables).
  # Colours: event categories, today marker, approval status.
  - "3.1"
  - "3.2"
  - "3.3"
  # Links: the navigation of the shell (lib-components AppShell).
  - "6.1"
  - "6.2"
  # Scripts: view tabs, event pills (role=button), dialogs, date pickers, the assignee listbox,
  # status and alert messages.
  - "7.1"
  - "7.3"
  - "7.5"
  - "8.1"
  - "8.2"
  - "8.3"
  - "8.4"
  - "8.5"
  - "8.6"
  - "8.9"
  # 8.7, 8.8: no text in another language; 8.10: no right-to-left text.
  - "9.1"
  - "9.2"
  - "9.3"
  # 9.4: no quotation.
  - "10.1"
  - "10.2"
  - "10.3"
  - "10.4"
  - "10.5"
  - "10.6"
  - "10.7"
  - "10.8"
  - "10.9"
  - "10.10"
  - "10.11"
  - "10.12"
  # Event form: fields, the "Jours" group of the weekly recurrence, selects, the time error.
  - "11.1"
  - "11.2"
  - "11.3"
  - "11.4"
  - "11.5"
  - "11.6"
  - "11.7"
  - "11.8"
  - "11.9"
  - "11.10"
  - "11.11"
  - "11.12"
  - "11.13"
  # Navigation of the shell, landmarks, skip link, focus order.
  - "12.6"
  - "12.7"
  - "12.8"
  - "12.9"
  # 13.3: no downloadable document.
  - "13.9"
  - "13.11"

# The engine fixes the browser clock at 2026-01-15T09:00 (Paris): the calendar opens on January 2026,
# where init-accessibility.sql puts the events. The middleware redirects to Login without a session:
# no "no session" state.
states:
  - id: month
    description: Month view (default) with the events of January 2026
    as: agent
    route: /
    steps:
      - wait_for: { role: button, name: Réunion de quartier }
  - id: week
    as: agent
    route: /
    steps:
      - wait_for: { role: button, name: Réunion de quartier }
      - click: { role: tab, name: Semaine }
      - wait_for: { selector: .calendar-week-grid }
      - wait_for: { role: button, name: Réunion de quartier }
  - id: day
    as: agent
    route: /
    steps:
      - wait_for: { role: button, name: Réunion de quartier }
      - click: { role: tab, name: Jour }
      - wait_for_hidden: { selector: .calendar-month-grid }
      # Only the 15th is shown: the event of the 13th leaves the grid.
      - wait_for_hidden: { role: button, name: Réunion de quartier }
  - id: empty-month
    description: Next month, without any event
    as: agent
    route: /
    steps:
      - wait_for: { role: button, name: Réunion de quartier }
      - click: { role: button, name: Période suivante }
      - wait_for_hidden: { role: button, name: Réunion de quartier }
  - id: create-dialog
    as: agent
    route: /
    steps:
      - wait_for: { role: button, name: Réunion de quartier }
      - click: { role: button, name: Nouvel événement }
      - wait_for: { role: dialog, name: Nouvel événement }
  - id: create-date-picker
    description: Date picker of the start date opened in the create dialog
    as: agent
    route: /
    steps:
      - wait_for: { role: button, name: Réunion de quartier }
      - click: { role: button, name: Nouvel événement }
      - click: { role: button, name: Ouvrir le calendrier pour Date de début }
      - wait_for: { role: button, name: Mois précédent }
  - id: create-recurrence
    description: Weekly recurrence chosen (interval, days, end of the recurrence)
    as: agent
    route: /
    steps:
      - wait_for: { role: button, name: Réunion de quartier }
      - click: { role: button, name: Nouvel événement }
      - select: { label: Récurrence, value: Chaque semaine }
      - wait_for: { label: Intervalle }
  - id: create-assignees
    description: Assignee listbox opened in the create dialog
    as: agent
    route: /
    steps:
      - wait_for: { role: button, name: Réunion de quartier }
      - click: { role: button, name: Nouvel événement }
      - click: { role: button, name: Sélectionner des personnes }
      - wait_for: { role: listbox }
  - id: create-time-error
    description: End time before the start time (client validation, nothing written)
    as: agent
    route: /
    steps:
      - wait_for: { role: button, name: Réunion de quartier }
      - click: { role: button, name: Nouvel événement }
      - fill: { label: Titre, value: Visite du chantier }
      - select: { label: Heure de début, value: 10 h 00 }
      - select: { label: Heure de fin, value: 09 h 00 }
      - click: { role: button, name: Créer, exact: true }
      - wait_for: { text: L’heure de fin doit être après l’heure de début }
  - id: event-details
    description: Details of an event opened from its link (?date=&event=)
    as: agent
    route: /?date=2026-01-15&event=900
    steps:
      # The sidebar repeats the description: look for it in the dialog.
      - wait_for: { role: dialog, name: Détail de l’événement }
      - wait_for: { selector: '[role="dialog"] p:has-text("Séance publique du conseil municipal.")' }
  - id: event-recurring
    description: Details of a weekly event
    as: agent
    route: /?date=2026-01-13&event=904
    steps:
      - wait_for: { role: dialog, name: Détail de l’événement }
      - wait_for: { selector: '[role="dialog"] p:has-text("Accueil des habitants sans rendez-vous.")' }
  - id: event-edit
    description: Edit form of an event (nothing saved)
    as: agent
    route: /?date=2026-01-15&event=900
    steps:
      - click: { role: button, name: Modifier }
      - wait_for: { role: dialog, name: Modifier l’événement }
  - id: event-pending
    description: Event waiting for the approval of a Responsable, seen by its creator
    as: agent
    route: /?date=2026-01-16&event=901
    steps:
      - wait_for: { role: dialog, name: Détail de l’événement }
      - wait_for: { selector: '[role="dialog"] p:has-text("Initiation aux démarches en ligne.")' }
      - wait_for: { text: En attente }
  - id: event-to-validate
    description: The same event seen by the Responsable (Valider / Refuser, not clicked)
    as: responsable
    route: /?date=2026-01-16&event=901
    steps:
      - wait_for: { role: dialog, name: Détail de l’événement }
      - wait_for: { selector: '[role="dialog"] p:has-text("Initiation aux démarches en ligne.")' }
      - wait_for: { role: button, name: Valider, exact: true }
  - id: event-created
    description: An event created (the dialog closes, the event appears in the month)
    as: writer
    route: /
    steps:
      - wait_for: { role: tab, name: Mois }
      - click: { role: button, name: Nouvel événement }
      - fill: { label: Titre, value: Visite du chantier }
      - click: { role: button, name: Créer, exact: true }
      - wait_for_hidden: { role: dialog }
      # The pill of the month grid (the sidebar lists the event too).
      - wait_for: { selector: '.calendar-month-grid [role="button"][title="Visite du chantier"]' }
