# GDPR usage simulation journey of the calendars front (MAIR-497), played by mairie360/CICD
# tests/gdpr/simulation for every persona of gdpr-simulation.yaml (gdpr-marker.yaml format of
# MAIR-290).
#
# The journey of BFF_Calendar's log marker test, sent to the front's own origin: the same-origin proxy
# (src/lib/bff-proxy.ts) relays it to the BFF with the accessToken cookie as a Bearer token, as for
# the browser, so the logs of the front see the persona's values in the bodies, the query strings
# and the deliberate errors. The proxy only forwards same-origin requests (Origin) and the paths of
# contracts/openapi.json; the first step defines the session headers the next ones reuse
# (*session).
version: 1
target: http://calendar-front:5002
wait: /
# Session of the run (the seeded admin), signed by gdpr_simulation_test.sh.
env: [ADMIN_JWT]
steps:
  - name: create an event naming the marker
    request:
      method: POST
      path: /calendar/events
      headers: &session {Cookie: "accessToken={{env.ADMIN_JWT}}", Origin: "http://calendar-front:5002"}
      json:
        title: "Meeting {{marker.first_name}} {{marker.last_name}}"
        date: "2030-06-15"
        startTime: "09:00"
        endTime: "10:00"
        category: meeting
        location: "Office of {{marker.last_name}}"
        description: "Call {{marker.phone}} or write to {{marker.email}}"
    expect: [201]
    capture:
      event_id: body.id
  - name: create an event with a refused title (deliberate error)
    request:
      method: POST
      path: /calendar/events
      headers: *session
      json: {title: "<{{marker.last_name}}>", date: "2030-06-15", description: "{{marker.email}}"}
    expect: [400]
  - name: create an event with a date of the wrong format (deliberate error)
    request:
      method: POST
      path: /calendar/events
      headers: *session
      json: {title: "Meeting {{marker.first_name}}", date: "{{marker.phone}}"}
    # The dates are checked as real days since main's isCalendarDate (a 502 before): 400.
    expect: [400]
  - name: create an event with a value of the wrong type (deliberate error)
    request:
      method: POST
      path: /calendar/events
      headers: *session
      json: {title: "Meeting {{marker.first_name}}", date: "2030-06-15", canEdit: "{{marker.email}}"}
    expect: [400]
  - name: list the events
    request: {method: GET, path: "/calendar/events?from=2030-06-01&to=2030-06-30", headers: *session}
  - name: list the events with a refused range (deliberate error, query string)
    request: {method: GET, path: "/calendar/events?from={{marker.email}}&to={{marker.phone}}", headers: *session}
    expect: [400]
  - name: read the bootstrap with a refused range (deliberate error, query string)
    request: {method: GET, path: "/calendar/bootstrap?from={{marker.last_name}}&to=2030-06-30", headers: *session}
    expect: [400]
  - name: list the assignees
    request: {method: GET, path: "/calendar/assignees?from=2030-06-01&to=2030-06-30", headers: *session}
  - name: update the event with the marker
    request:
      method: PATCH
      path: "/calendar/events/{{event_id}}"
      headers: *session
      json: {title: "Meeting {{marker.last_name}}", description: "New number {{marker.phone}}, {{marker.email}}"}
  - name: update an event that does not exist (deliberate error)
    request:
      method: PATCH
      path: /calendar/events/999999
      headers: *session
      json: {title: "Meeting {{marker.last_name}}", description: "{{marker.email}}"}
    expect: [404]
  - name: update the event with a refused location (deliberate error)
    request:
      method: PATCH
      path: "/calendar/events/{{event_id}}"
      headers: *session
      json: {location: "<{{marker.email}}>"}
    expect: [400]
  - name: approve the event with an unknown status (deliberate error)
    request:
      method: PATCH
      path: "/calendar/events/{{event_id}}/approval"
      headers: *session
      json: {approvalStatus: "{{marker.last_name}}"}
    expect: [400]
  - name: list the events with an invalid token (deliberate error)
    request: {method: GET, path: "/calendar/events?from=2030-06-01&to=2030-06-30", headers: {Cookie: "accessToken={{marker.password}}", Origin: "http://calendar-front:5002"}}
    expect: [401]
